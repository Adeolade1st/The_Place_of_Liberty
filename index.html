<!doctype html>
<html lang="en">

    <meta name="author" content=" Place of Liberty" />

    <!-- 2. Primary SEO & Google Search Optimization -->
    <title>Place of Liberty | Special Needs School in Surulere, Lagos</title>
    <meta name="description" content="The Place of Liberty is a premier special needs school in Surulere, Lagos. Offering specialized education, therapy services, vocational programs, and dedicated support for children." />
    <meta name="keywords" content="special needs school lagos, autism school surulere, therapy services for children lagos, special education nigeria, vocational school for disabled lagos, down syndrome school lagos" />
    <link rel="canonical" href="https://placeofliberty.com" />

    <!-- 3. Open Graph Link Preview Optimization (WhatsApp, Facebook, LinkedIn) -->

    <meta name="twitter:image" content="https://placeofliberty.orgfavicon-32x32.png" />

    <link rel="preconnect" href="https://googleapis.com" />
